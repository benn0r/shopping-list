appId: ch.benn0r.shoppinglist
---
# One-tap shopping (on for new installs): a tap checks an item off, Undo brings it back, and
# holding an item still opens its details.
- launchApp:
    clearState: true
- tapOn:
    id: "mode-offline"
- tapOn:
    id: "mode-continue"
# New installs start with one-tap shopping on.
- tapOn:
    id: "add-item-field"
- inputText: "Bread"
- pressKey: Enter
- tapOn:
    id: "add-item-field"
- inputText: "Milk"
- pressKey: Enter
- hideKeyboard
- tapOn: "Bread"
- extendedWaitUntil:
    visible:
      id: "check-off-banner"
    timeout: 3000
- assertNotVisible: "^Bread$"
- assertVisible: "Milk"
- tapOn:
    id: "undo-check-off"
- extendedWaitUntil:
    visible: "Bread"
    timeout: 3000
- longPressOn: "Milk"
- assertVisible: "Details"
- tapOn: "Details"
- assertVisible: ".*Added.*"
