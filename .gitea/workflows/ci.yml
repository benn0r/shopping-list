name: Native iOS CI
on:
  push:
  pull_request:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: .build/DerivedData/Build/Products/Release-iphoneos/Shopping List.app
          if-no-files-found: error

  test:
    needs: build
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: command -v xcodegen || brew install xcodegen
      - run: npm test

  test-e2e:
    needs: build
    runs-on: macos
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: command -v xcodegen || brew install xcodegen
      - name: Install Maestro
        run: command -v maestro || brew install maestro
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results
          path: ~/.maestro/tests
          if-no-files-found: ignore

  publish:
    needs: [test, test-e2e]
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: command -v xcodegen || brew install xcodegen
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: shopping-list-ios-${{ gitea.sha }}
          path: .build/DerivedData/Build/Products/Release-iphoneos/Shopping List.app
          if-no-files-found: error
          retention-days: 30
