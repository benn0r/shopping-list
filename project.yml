name: ShoppingList
options:
  bundleIdPrefix: ch.benn0r
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  ShoppingList:
    type: application
    # One target and one bundle ID for iPhone and Mac, so both share the App Store Connect
    # record (Universal Purchase). The Mac has its own interface in ShoppingListApp/Mac.
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ShoppingListApp
        excludes:
          - Mac
          - ShoppingListScreen.swift
          - ShoppingScreen.swift
          - SettingsScreen.swift
      - path: ShoppingListApp/ShoppingListScreen.swift
        destinationFilters: [iOS]
      - path: ShoppingListApp/ShoppingScreen.swift
        destinationFilters: [iOS]
      - path: ShoppingListApp/SettingsScreen.swift
        destinationFilters: [iOS]
      - path: ShoppingListApp/Mac
        destinationFilters: [macOS]
      - path: assets/food-icons
        buildPhase: resources
    entitlements:
      path: ShoppingListApp/ShoppingList.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Invite links (https://<cloud server>/app/invite/<token>) open the app.
        com.apple.developer.associated-domains: ["applinks:shopping-list.tueftli.com"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benn0r.shoppinglist
        PRODUCT_NAME: Shopping List
        PRODUCT_MODULE_NAME: ShoppingList
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
        BRING_API_KEY: ${BRING_API_KEY}
        CLOUD_SERVER_URL: ${CLOUD_SERVER_URL}
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 6
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShoppingListApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Mac app runs in the App Sandbox; iOS keeps the generated entitlements above.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ShoppingListApp/Mac/ShoppingList-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
    scheme:
      testTargets: [ShoppingListTests]
    postBuildScripts:
      - name: Install Debug Screenshot Fixtures
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            fixture_destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp "$SRCROOT/maestro/fixtures/DemoFridge.png" "$fixture_destination/DemoFridge.png"
            cp "$SRCROOT/maestro/fixtures/DemoProduct.png" "$fixture_destination/DemoProduct.png"
          fi
        basedOnDependencyAnalysis: false
  ShoppingListTests:
    type: bundle.unit-test
    platform: iOS
    sources: ShoppingListTests
    dependencies:
      - target: ShoppingList
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shopping List.app/Shopping List"
        BUNDLE_LOADER: "$(TEST_HOST)"
