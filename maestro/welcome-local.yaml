appId: ch.benn0r.shoppinglist
---
# Fresh install: keep the first list on this iPhone under a custom name.
- launchApp:
    clearState: true
- assertVisible: "Create your first list"
- takeScreenshot: artifacts/welcome-card
- tapOn:
    id: "welcome-list-name"
- eraseText: 20
- inputText: "Wocheneinkauf"
- pressKey: Enter
- tapOn:
    id: "welcome-create-list"
- assertNotVisible:
    id: "welcome-card"
- assertVisible: "Wocheneinkauf"
- launchApp:
    stopApp: true
- assertNotVisible: "Create your first list"
