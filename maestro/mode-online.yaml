appId: ch.benn0r.shoppinglist
---
# Fresh install: choose online. Debug builds replace the Apple sheet with a fixed mock
# credential, which the mock server exchanges for a Cloud session.
- launchApp:
    clearState: true
    arguments:
      mockAppleSignIn: true
      cloudServerURL: "http://127.0.0.1:8787"
# A system "Sign in to your Apple Account" alert can survive from an earlier real sign-in attempt.
- tapOn:
    text: "Close"
    optional: true
- assertVisible: "Welcome to Shopping List"
- tapOn:
    id: "mode-online"
- assertVisible: "Share with Family"
- takeScreenshot: artifacts/mode-online
# (Maestro can't read a sheet stacked on the full-screen welcome, so the info sheet is checked in
# Settings below.)
- assertVisible:
    id: "cloud-info-button"
- tapOn:
    id: "continue-with-apple"
- extendedWaitUntil:
    notVisible: "Welcome to Shopping List"
    timeout: 8000
- tapOn:
    id: "add-item-field"
- inputText: "Bread"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Bread.*"
    timeout: 5000
- takeScreenshot: artifacts/cloud-welcome-list
# The mock server "generates" the Kombucha icon for 4 s: a sparkle shows meanwhile, then the
# app polls, the sparkle disappears and the generated icon fades in.
- tapOn:
    id: "add-item-field"
- inputText: "Kombucha"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "icon-pending"
    timeout: 5000
- takeScreenshot: artifacts/icon-pending
- extendedWaitUntil:
    notVisible:
      id: "icon-pending"
    timeout: 15000
- takeScreenshot: artifacts/icon-ready
# A second list created straight in Cloud from Settings, without a second sign-in.
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "cloud-account-name"
    direction: DOWN
- assertVisible: ".*Alex.*"
- scrollUntilVisible:
    element: "About Shopping List Cloud"
    direction: DOWN
- tapOn: "About Shopping List Cloud"
- assertVisible: "Generated icons for every item"
- tapOn: "Done"
- scrollUntilVisible:
    element:
      id: "add-list-button"
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "add-list-button"
- tapOn:
    id: "list-name-field"
- inputText: "Party"
# Online has no lists on this iPhone, so new lists go to Cloud.
- assertVisible: ".*Stored In.*Shopping List Cloud.*"
- assertNotVisible:
    id: "storage-local"
- tapOn:
    id: "save-list-button"
- extendedWaitUntil:
    visible: "Party"
    timeout: 5000
- tapOn: "Party"
- assertVisible:
    id: "list-storage"
- assertVisible: ".*Stored In.*Shopping List Cloud.*"
- tapOn: "Cancel"
# Signing out switches to offline and keeps both lists on the iPhone.
- scrollUntilVisible:
    element:
      id: "cloud-sign-out"
    direction: DOWN
- tapOn:
    id: "cloud-sign-out"
- assertVisible: "Sign out of Shopping List Cloud?"
- tapOn: "Sign Out"
- scrollUntilVisible:
    element:
      id: "continue-with-apple"
    direction: DOWN
- scrollUntilVisible:
    element: "Party"
    direction: UP
- scrollUntilVisible:
    element:
      id: "storage-mode"
    direction: DOWN
    centerElement: true
# Going online again links both lists to the Cloud lists with the same names: no copies.
- tapOn:
    id: "continue-with-apple"
- extendedWaitUntil:
    visible:
      id: "cloud-account-name"
    timeout: 8000
- scrollUntilVisible:
    element: "Party"
    direction: UP
- tapOn: "Party"
- assertVisible: ".*Stored In.*Shopping List Cloud.*"
- tapOn: "Cancel"
- scrollUntilVisible:
    element: ".*Lists in Cloud.*2.*"
    direction: DOWN
    centerElement: true
