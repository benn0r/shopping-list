appId: ch.benn0r.shoppinglist
---
- launchApp:
    clearState: true
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "enable-server-sync"
    direction: DOWN
- tapOn:
    id: "enable-server-sync"
    point: "90%,50%"
- scrollUntilVisible:
    element:
      id: "server-secret"
    direction: DOWN
# Fill the lower field first: the keyboard would cover it after typing the URL.
- tapOn:
    id: "server-secret"
- inputText: "slt_mock"
- tapOn:
    id: "server-server-url"
- inputText: "http://127.0.0.1:8787"
- tapOn:
    point: "50%,10%"
- scrollUntilVisible:
    element:
      id: "add-list-button"
    direction: UP
- tapOn:
    id: "add-list-button"
- tapOn:
    id: "list-name-field"
- inputText: "Server"
- tapOn: "Provider"
- tapOn: "Shopping List Server"
- extendedWaitUntil:
    visible: "Mock Groceries"
    timeout: 5000
- tapOn: "Save"
- tapOn: "Shopping List"
- tapOn: "Choose list"
- tapOn: "Server"
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible: ".*Bread.*"
    timeout: 5000
